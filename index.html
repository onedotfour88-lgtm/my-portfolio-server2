<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이시헌 포트폴리오</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 2rem; border-radius: 12px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { margin-bottom: 0.5rem; }
        p { color: #aaa; font-size: 0.9rem; }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 1.5rem; }
        button { padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-secondary { background: #374151; color: white; }
        .status { margin-top: 1rem; font-weight: bold; color: #f87171; }
        .content-area { margin-top: 1.5rem; text-align: left; background: #2a2a2a; padding: 1rem; border-radius: 8px; display: none; }
        .item { margin-bottom: 1rem; border-bottom: 1px solid #3d3d3d; padding-bottom: 0.5rem; }
        .item:last-child { border-bottom: none; }
        .item-title { font-weight: bold; color: #60a5fa; }
    </style>
</head>
<body>

<div class="card">
    <h1>🔒 이시헌 포트폴리오</h1>
    <p>비공개 데이터 및 상세 포트폴리오 접근을 위해 Passkey 인증이 필요합니다.</p>
    
    <div id="status" class="status">상태: 인증 필요 (비로그인)</div>

    <div class="btn-group">
        <button class="btn-primary" onclick="loginPasskey()">🔑 패스키로 로그인</button>
        <button class="btn-secondary" onclick="registerPasskey()">➕ 새 패스키 등록</button>
    </div>

    <div id="content" class="content-area"></div>
</div>

<script>
    function bufferDecode(value) {
        return Uint8Array.from(atob(value.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
    }

    function bufferEncode(value) {
        return btoa(String.fromCharCode(...new Uint8Array(value)))
            .replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
    }

    async function registerPasskey() {
        try {
            const beginRes = await fetch('/api/register/begin', { method: 'POST' });
            const options = await beginRes.json();
            
            if (!beginRes.ok) {
                alert('등록 초기화 실패: ' + (options.error || JSON.stringify(options)));
                return;
            }

            options.challenge = bufferDecode(options.challenge);
            options.user.id = bufferDecode(options.user.id);

            const cred = await navigator.credentials.create({ publicKey: options });
            const regData = {
                id: cred.id,
                rawId: bufferEncode(cred.rawId),
                type: cred.type,
                response: {
                    attestationObject: bufferEncode(cred.response.attestationObject),
                    clientDataJSON: bufferEncode(cred.response.clientDataJSON)
                }
            };

            const completeRes = await fetch('/api/register/complete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(regData)
            });

            const result = await completeRes.json();
            if (result.status === 'OK') {
                alert('패스키 등록에 성공했습니다!');
                loadPortfolio();
            } else {
                alert('등록 완료 실패: ' + result.error);
            }
        } catch (err) {
            alert('패스키 등록 중 오류: ' + err.message);
        }
    }

    async function loginPasskey() {
        try {
            const beginRes = await fetch('/api/authenticate/begin', { method: 'POST' });
            const options = await beginRes.json();

            if (!beginRes.ok) {
                alert('로그인 초기화 실패: ' + (options.error || JSON.stringify(options)));
                return;
            }

            options.challenge = bufferDecode(options.challenge);

            const cred = await navigator.credentials.get({ publicKey: options });
            const authData = {
                id: cred.id,
                rawId: bufferEncode(cred.rawId),
                type: cred.type,
                response: {
                    authenticatorData: bufferEncode(cred.response.authenticatorData),
                    clientDataJSON: bufferEncode(cred.response.clientDataJSON),
                    signature: bufferEncode(cred.response.signature),
                    userHandle: cred.response.userHandle ? bufferEncode(cred.response.userHandle) : null
                }
            };

            const completeRes = await fetch('/api/authenticate/complete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(authData)
            });

            const result = await completeRes.json();
            if (result.status === 'OK') {
                alert('인증 성공!');
                loadPortfolio();
            } else {
                alert('로그인 실패: ' + result.error);
            }
        } catch (err) {
            alert('로그인 중 오류: ' + err.message);
        }
    }

    async function loadPortfolio() {
        const res = await fetch('/api/private-data');
        if (res.ok) {
            const data = await res.json();
            document.getElementById('status').innerText = '상태: 인증됨 (접근 완료)';
            document.getElementById('status').style.color = '#4ade80';
            
            const contentDiv = document.getElementById('content');
            contentDiv.style.display = 'block';
            contentDiv.innerHTML = data.items.map(item => `
                <div class="item">
                    <div class="item-title">${item.title}</div>
                    <div>${item.content}</div>
                </div>
            `).join('');
        }
    }
</script>
</body>
</html>
